[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-bridge"
version = "1.0.0"
description = "把本地 opencode CLI 封装成 OpenAI 兼容 API（支持原生 Function Calling）的桥接网关"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
